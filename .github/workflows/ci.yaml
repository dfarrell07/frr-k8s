name: CI

on:
  merge_group:
  pull_request:
    paths-ignore:
      - 'DCO'
      - 'LICENSE'
      - 'README.md'
      - 'HOW_TO_RELEASE.md'
      - 'RELEASE_NOTES.md'
    branches:
      - "main"
      - "v**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-analysis:
    runs-on: ubuntu-22.04
    env:
      GO111MODULE: on
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.24.7
        with:
          args: -exclude-dir e2etest -severity medium ./...

      - name: Golang Vulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-file: go.mod

  check-generated:
    runs-on: ubuntu-22.04
    if: github.actor != 'renovate[bot]'
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Check Generated
        run: |
          make bumplicense
          go mod tidy
          pushd e2etests
          go mod tidy
          popd
          make manifests
          make generate
          make generate-all-in-one
          make api-docs
          make checkuncommitted

      - name: Helm doc generate
        uses: docker://jnorwood/helm-docs:v1.10.0

      - name: Check helm docs comments
        run: make verify-helm-docs-comments

      - name: Check if docs are different
        run: make checkuncommitted

  commitlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Unit Tests
        run: |
          make test
          (cd e2etests && go test ./tests -run TestGRCI)

  build-test-images:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export the image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: quay.io/metallb/frr-k8s:main
          file: Dockerfile
          outputs: type=docker,dest=/tmp/frrk8s.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload frrk8s artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: image-tar-frrk8s
          path: /tmp/frrk8s.tar
  build-frr-gr:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout corrected FRR
        uses: actions/checkout@v4
        with:
          repository: dfarrell07/frr
          ref: 9cfa2040d418cbfb11aceb2d07443c8f6289dc0f
          path: frr-source
      - name: Prepare source archive
        run: |
          mkdir -p /tmp/frr-build/source
          git -C frr-source rev-parse HEAD > /tmp/frr-build/source-revision.txt
          git -C frr-source archive HEAD > /tmp/frr-source.tar
          sha256sum /tmp/frr-source.tar > /tmp/frr-build/source-archive.sha256
          tar -xf /tmp/frr-source.tar -C /tmp/frr-build/source
          cp .github/frr-gr/Dockerfile /tmp/frr-build/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build and test corrected FRR image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/frr-build
          target: runtime
          tags: localhost/frr-gr-validation:9cfa2040
          outputs: type=docker,dest=/tmp/frr-gr.tar
          cache-from: type=gha,scope=frr-gr
          cache-to: type=gha,mode=max,scope=frr-gr
      - name: Export native test and build evidence
        uses: docker/build-push-action@v5
        with:
          context: /tmp/frr-build
          target: evidence
          outputs: type=local,dest=/tmp/frr-evidence
          cache-from: type=gha,scope=frr-gr
      - name: Record runtime payload
        run: |
          docker load -i /tmp/frr-gr.tar
          docker image inspect localhost/frr-gr-validation:9cfa2040 > /tmp/frr-evidence/image.json
          docker run --rm --entrypoint sh localhost/frr-gr-validation:9cfa2040 -ec '
            for daemon in bgpd zebra bfdd staticd mgmtd watchfrr; do
              /usr/lib/frr/$daemon --version
              ldd /usr/lib/frr/$daemon
              sha256sum /usr/lib/frr/$daemon
            done
          ' > /tmp/frr-evidence/runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-tar-frr-gr
          path: /tmp/frr-gr.tar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: frr-gr-build-evidence
          path: /tmp/frr-evidence
          retention-days: 7
  e2e:
    runs-on: ubuntu-22.04
    needs:
      - unit-tests
      - build-test-images
      - build-frr-gr
      - commitlint
    strategy:
      fail-fast: false
      matrix:
        ip-family: [ipv4, ipv6]
        deployment: [manifests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install linux-modules-extra-$(uname -r)

      - name: Download frr8ks images
        uses: actions/download-artifact@v4
        with:
          path: image

      - name: Load image
        working-directory: image
        run: |
          docker load -i image-tar-frrk8s/frrk8s.tar
          docker load -i image-tar-frr-gr/frr-gr.tar

      - name: Deploy on kind
        run: |
          MAKE_RULE="deploy-with-prometheus"
          if [ ${{ matrix.deployment }} = "helm" ]; then MAKE_RULE="deploy-helm"; fi
          LOGLEVEL=debug IP_FAMILY="${{ matrix.ip-family }}" make deploy-cluster
          bin/kind load docker-image localhost/frr-gr-validation:9cfa2040 -n frr-k8s
          (cd config/frr-k8s && ../../bin/kustomize edit set image quay.io/frrouting/frr=localhost/frr-gr-validation:9cfa2040)
          HELM_ARGS="--set frrk8s.frr.image.repository=localhost/frr-gr-validation --set frrk8s.frr.image.tag=9cfa2040 --set frrk8s.frr.image.pullPolicy=Never" LOGLEVEL=debug IP_FAMILY="${{ matrix.ip-family }}" make $MAKE_RULE
          mkdir -p /tmp/kind_logs/

      - name: E2E
        run: |
          SKIP="'echo mode enabled'"
          if [ "${{ matrix.ip-family }}" == "ipv4" ]; then SKIP="$SKIP\|IPV6\|DUALSTACK"; fi
          if [ "${{ matrix.ip-family }}" == "dual" ]; then SKIP="$SKIP\|IPV6"; fi
          if [ "${{ matrix.ip-family }}" == "ipv6" ]; then SKIP="$SKIP\|IPV4\|DUALSTACK"; fi
          SKIP="$SKIP\|Leaked.*advertising" # TODO fixed by frr 10.0, remove this when https://github.com/metallb/frr-k8s/issues/165 is fixed
          GINKGO_ARGS="--focus EnableGracefulRestart --skip $SKIP" TEST_ARGS="--report-path=/tmp/kind_logs --frr-image=quay.io/frrouting/frr@sha256:89e5e1ec8b17c5dffaf57dbac58a29ebeb3731a84e5bc09dad1662adff2ba7f5" make e2etests

      - name: Export kind logs
        if: ${{ always() }}
        run:
          make kind-export-logs

      - name: Collect Logs
        if: ${{ always() }}
        uses: ./.github/workflows/composite/collectlogs
        with:
          artifact-name: kind-logs-${{ matrix.ip-family }}-${{ matrix.deployment }}
