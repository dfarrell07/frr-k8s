name: PR 519 EVPN diagnostics

on:
  workflow_dispatch:

jobs:
  evpn:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: a57f09cf7458056f32f5a903f62f1a1ac18331e8
            name: base
          - source: b49e96e3161219ba0f90ce94a5c6c5cc2fca8439
            name: head
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kernel modules
        run: |
          sudo apt-get update
          sudo apt-get install linux-modules-extra-$(uname -r)
      - name: Add failure diagnostics
        run: git show '${{ github.sha }}:e2etests/tests/evpn.go' > e2etests/tests/evpn.go
      - name: Build original image
        run: docker build -t quay.io/metallb/frr-k8s:main .
      - name: Deploy original dual manifests
        run: |
          LOGLEVEL=debug IP_FAMILY=dual make deploy-with-prometheus
          mkdir -p /tmp/kind_logs
          bin/kubectl --kubeconfig=bin/kubeconfig -n frr-k8s-system get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}{.name}{" "}{.imageID}{"\n"}{end}{end}'
      - name: Repeat original L2 EVPN cases with original seed
        run: |
          GINKGO_ARGS="--focus 'EVPN sessions.*DUALSTACK configurations with IPv6 peering.*with L2 VNI' --seed=1793735237 --repeat=9" TEST_ARGS="--report-path=/tmp/kind_logs" make e2etests
      - name: Export kind logs
        if: failure()
        run: make kind-export-logs
      - name: Collect logs
        if: failure()
        uses: ./.github/workflows/composite/collectlogs
        with:
          artifact-name: pr519-evpn-${{ matrix.name }}
